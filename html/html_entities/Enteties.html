<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Enteties</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    
    <!--html entity using &entityName;-->
    <div style="font-size: 50px;">
        <b>Copy-Right: </b>&copy; <br>
        <b>Alpha: </b>&aleph; <br>
        <b>Beta: </b>&beta; <br>
        <b>Gamma: </b>&gamma; <br>
    </div>

    <!--html entity using &#entityNumber;-->
    <div style="font-size: 50px;">
        &#91; &#10; &#65; &hyphen; &#90; &#10; &#93;
        <br>
        &#91; &#97; &hyphen; &#122; &#93;
    </div>

    <div style="font-size: 50px;">
        &#128103; &#128104;
    </div>
</body>
</html>
