<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarqueeText</title>
</head>
<body>
    <marquee behavior="slide" direction="">
        <b>
            ScrollableContent
        </b>
    </marquee>

    <marquee behavior="alternate" direction="" scrollamount="60">
        <b>
            Alernate Text
        </b>
    </marquee>
</body>
</html>
