<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Data-Form</title>
</head>

<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <center>
        <fieldset style="width: fit-content; text-align: left;">
            <legend>
                <h1>Bio-Data-Form</h1>
            </legend>
            <form action="" style="font-size: 20px;">
                <b>Personal Information</b>
                <hr>
                <!-- First Group-->
                <div style="float: left; font-weight: bold;">
                    <div>
                        <label for="">Full Name</label>
                        <sup style="color: red;">*</sup>
                    </div>
                    <div>
                        <input style = "width: 300px; height: 40px; font-size: 20px;" type="text" name="" id="" placeholder="Enter full name" required>
                    </div>
                </div>
                <div style="width: 10px; height: 10px; float: left;"></div>
                <div style="float: right; font-weight: bold;">
                    <div>
                        <label for="">Email Address</label>
                        <sup style="color: red;">*</sup>
                    </div>
                    <div>
                        <input style = "width: 300px; height: 40px; font-size: 20px;" type="text" name="" id="" placeholder="Enter email" required>
                    </div>
                </div>
                <br>
                <br>
                <br>
                <br>
                <!-- Second Group -->
                <div style="font-weight: bold; float: left;">
                    <div>
                        <label for="">Password</label>
                        <sup style="color: red;">*</sup>
                    </div>
                    <div>
                        <input style = "width: 300px; height: 40px; font-size: 20px;" type="password" name="" id="" placeholder="Enter your password" required>
                    </div>
                </div>
                <div style="width: 10px; height: 10px; float: left;"></div>
                <div style="float: right; font-weight: bold;">
                    <div>
                        <label for="">Confirm Password</label>
                        <sup style="color: red;">*</sup>
                    </div>
                    <div>
                        <input style = "width: 300px; height: 40px; font-size: 20px;" type="text" name="" id="" placeholder="Confirm your password" required>
                    </div>
                </div>
                <br>
                <br>
                <br>
                <br>

                <!-- Third Group-->
                 <div style="font-weight: bold; float: left;">
                    <div>
                        <label for="">Date Of Birth</label>
                        <sup style="color: red;">*</sup>
                    </div>
                    <div>
                        <input style = "width: 300px; height: 40px; font-size: 20px;" type="date" name="" id="" required>
                    </div>
                </div>
                <div style="width: 20px; height: 10px; float: left;"></div>
                <div style="font-weight: bold;">
                    <div>
                        <label for="">Gender</label>
                        <sup style="color: red;">*</sup>
                    </div>
                    <div style="text-align: center;">
                        <input type="radio" name="gender" id="" style="width: 20px; height: 20px;"><label for="">Male</label>
                        <input type="radio" name="gender" id="" style="width: 20px; height: 20px;"><label for="">Female</label>
                        <input type="radio" name="gender" id="" style="width: 20px; height: 20px;"><label for="">other</label>
                    </div>
                </div>
                <br>
                <br>
                
                <!-- Fourth Group-->
                <div style="font-weight: bold; float: left;">
                    <div>
                        <label for="">Phone Number</label>
                        <sup style="color: red;">*</sup>
                    </div>
                    <div>
                        <input style = "width: 300px; height: 40px; font-size: 20px;" type="tel" name="" id="" placeholder="Enter your phone number" required>
                    </div>
                </div>
                <div style="width: 10px; height: 10px; float: left;"></div>
                <div style="float: right; font-weight: bold;">
                    <div>
                        <label for="">Website</label>
                        <sup style="color: red;">*</sup>
                    </div>
                    <div>
                        <input style = "width: 300px; height: 40px; font-size: 20px;" type="url" name="" id="" placeholder="https://example.com" required>
                    </div>
                </div>
                <br>
                <br>
                <br>
                <br>
                <!-- address div -->
                <div>
                    <b>Address</b>
                    <hr>
                    <div style="font-weight: bold;">
                        <div>
                            <label for="">Street</label>
                            <sup style="color: red;">*</sup>
                        </div>
                        <div>
                            <input style = "width: 98%; height: 40px; font-size: 20px;" type="url" name="" id="" placeholder="Enter street address" required>
                        </div>
                    </div>
                    <div style="font-weight: bold;">
                        <div>
                            <label for="">Address Line 2</label>
                        </div>
                        <div>
                            <input style = "width: 98%; height: 40px; font-size: 20px;" type="url" name="" id="" placeholder="Apartment, suite, unit, etc. (optional)">
                        </div>
                    </div>
                    <br>
                </div>

                <!--buttons-->
                <input type="submit" value="Submit" style="font-size: 35px; width: 150px; height: 40px; color: white; background-color: green;">
                <input type="reset" value="Reset" style="font-size: 35px; width: 150px; height: 40px; color: white; background-color: red">

            </form>
        </fieldset>
    </center>
</body>

</html>
