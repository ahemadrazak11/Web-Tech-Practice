<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <center>
        <form action="">
            <table style="border: 2px solid black">
                <caption style="font-size: 55px; font-weight: bold; color: white; background-color: black;">HTML Form</caption>
                <tbody style="font-size: 30px;">
                    <tr>
                        <td><label for="">Username</label></td>
                        <td><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;"
                                type="text"></td>
                    </tr>
                    <tr>
                        <td><label for="">Password</label></td>
                        <td><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;"
                                type="password"></td>
                    </tr>
                    <tr>
                        <td><label for="">Age</label></td>
                        <td><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;"
                                type="number" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">Mobile</label></td>
                        <td><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;"
                                type="tel" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">PickColor</label></td>
                        <td><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;"
                                type="color" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">ChooseFile</label></td>
                        <td><input style="font-size: 30px; background-color: lightgray; border: none; outline: none; width: 90%;" type="file" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">SelectDate</label></td>
                        <td><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;"
                                type="date" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">SelectMonth</label></td>
                        <td><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;"
                                type="month" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">SelectDateTime</label></td>
                        <td><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;"
                                type="datetime-local" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">SelectWeek</label></td>
                        <td><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;"
                                type="week" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">SelectTime</label></td>
                        <td><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;" type="time" name="time" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">Gender</label></td>
                        <td>
                            <input style="width: 30px; height: 30px;" type="radio" name="Gender" id="gender_male" value="male"><label for="gender_male">Male</label>
                            <input style="width: 30px; height: 30px;" type="radio" name="Gender" id="" value="female"><label for="">Female</label>
                            <input style="width: 30px; height: 30px;" type="radio" name="Gender" id="" value="other"><label for="">Other</label>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="">SkillSet</label></td>
                        <td>
                            <input style="width: 30px; height: 30px;" type="checkbox" name="html" id=""><label
                                for="">HTMl</label>
                            <input style="width: 30px; height: 30px;" type="checkbox" name="css" id=""><label
                                for="">CSS</label>
                            <input style="width: 30px; height: 30px;" type="checkbox" name="js" id=""><label
                                for="">JavaScript</label>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="">SelectRange</label></td>
                        <td><input type="range" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">Email</label></td>
                        <td><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;"
                                type="email" name="" id=""></td>

                    </tr>
                    <tr>
                        <td><label for="">Search</label></td>
                        <td><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;"
                                type="search" name="" id=""></td>

                    </tr>
                    <tr>
                        <th><input style="font-size: 30px; background-color: green; border: none; outline: none;"
                                type="submit" value="login"></td>
                        <th><input style="font-size: 30px; background-color: red; border: none; outline: none;"
                                type="reset" value="cancle"></td>
                    </tr>
                </tbody>
            </table>
        </form>
    </center>
</body>

</html>
