<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Attribute</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: bold;">
    <center>
        <fieldset style="width: fit-content;" contentfit>
            <legend style="font-size: 50px;background-color: red; color: white; border-radius: 20px;">HTML Form</legend>
            <form action="google.com" method="get">
                <div>
                    <input style="width: 400px; height: 40px;" type="text" name="userName" id="" placeholder="Username" required>
                    <b style="color: red"><sup>*</sup></b>
                </div>
                <div>
                    <input style="width: 400px; height: 40px;" type="password" name="passWord" id="" placeholder="Password" required>
                    <b style="color: red"><sup>*</sup></b>
                </div>
                <div>
                    <input type="tel" name="" id="" placeholder="Phone" style="width: 400px; height: 40px;">
                </div>
                <div>
                    <input type="email" name="" id="" placeholder="Email" style="width: 400px; height: 40px;">
                </div>
                <div>
                    <input type="url" name="" id="" placeholder="Website" style="width: 400px; height: 40px;">
                </div>
                <div>
                    <input type="image" src="../../assets/images/Tajmahal.jpg" alt="" style="width: 100px; height: 100px;">
                </div>
                <br>
                <div>
                    <input style="outline: none; border: none; font-size: 30px; background-color: green; width: 150px; height: 35px; border-radius: 10px;" type="submit" value="Submit">
                    <input style="outline: none; border: none; font-size: 30px; background-color: red; width: 150px; height: 35px; border-radius: 10px;" type="reset" value="Reset">
                </div>
                

                    
            </form>
        </fieldset>
    </center>
</body>
</html>
