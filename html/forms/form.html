<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <center>
        <form action="">
            <table style="background-color: lightblue;border-collapse: separate; border: 2px solid red">
                <caption style="font-size: 55px; font-weight: bold;">HTML Form</caption>
                <tbody style="font-size: 30px;">
                    <tr>
                        <td><label for="">Username</label></td>
                        <td colspan = "3"><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;" type="text"></td>
                    </tr>
                    <tr>
                        <td><label for="">Password</label></td>
                        <td colspan = "3"><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;" type="password"></td>
                    </tr>
                    <tr>
                        <td><label for="">Age</label></td>
                        <td><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;" type="number" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">MobileNumber</label></td>
                        <td colspan = "3"><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;" type="tel" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">PickColor</label></td>
                        <td colspan = "3"><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;" type="color" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">ChooseFile</label></td>
                        <td colspan = "3"><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;" type="file" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">SelectDate</label></td>
                        <td colspan = "3"><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;" type="date" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">SelectMonth</label></td>
                        <td><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;" type="month" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">SelectDateTime</label></td>
                        <td colspan = "3"><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;" type="datetime-local" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">SelectWeek</label></td>
                        <td colspan = "3"><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;" type="week" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">Gender</label></td>
                        <td><input style="width: 30px; height: 30px;" type="radio" name="Gender" id="">Female</td>
                        <td><input style="width: 30px; height: 30px;" type="radio" name="Gender" id="">Male</td>
                        <td><input style="width: 30px; height: 30px;" type="radio" name="Gender" id="">Other</td>
                    </tr>
                    <tr>
                        <td><label for="">SkillSet</label></td>
                        <td><input style="width: 30px; height: 30px;" type="checkbox" name="html" id="">HTMl</td>
                        <td><input style="width: 30px; height: 30px;" type="checkbox" name="css" id="">CSS</td>
                        <td><input style="width: 30px; height: 30px;" type="checkbox" name="js" id="">JS</td>
                    </tr>
                    <tr>
                        <td><label for="">SelectRange</label></td>
                        <td colspan = "3"><input type="range" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for=""></label></td>
                        <td colspan = "3"><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;" type="week" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">SelectWeek</label></td>
                        <td colspan = "3"><input style="font-size: 30px; background-color: lightgray; border: none; outline: none;" type="week" name="" id=""></td>
                    </tr>
                    <tr>
                        <th><input style="font-size: 30px; background-color: green; border: none; outline: none;" type="submit" value="login"></td>
                        <th><input style="font-size: 30px; background-color: red; border: none; outline: none;" type="reset" value="cancle"></td>
                    </tr>
                </tbody>
            </table>
        </form>
    </center>
</body>
</html>
