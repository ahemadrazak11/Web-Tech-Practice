<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbsoluteUnits</title>
    <link rel="stylesheet" href="AbsoluteUnits.css">
</head>
<body>
    <h1>Absolute Units</h1>
    <div class="blocks" id="pixel">
        <h2>Pixel</h2>
        <div>width: 500px<br>
             height: 100px;</div>
    </div>
    <div class="blocks" id="centimeter">
        <h2>Centimeter</h2>
        <div>width: 10cm<br>
            height: 3cm</div>
    </div>
    <div class="blocks" id="millimeter">
        <h2>Millimeter</h2>
        <div>width: 100mm<br>
            height: 30mm</div>
    </div>
    <div class="blocks" id="inch">
        <h2>Inch</h2>
        <div>width: 10in<br>
            height: 1in</div>
    </div>
    <div class="blocks" id="point">
        <h2>Point</h2>
        <div>width: 500pt<br>
            height: 70pt</div>
    </div>
    <div class="blocks" id="picas">
        <h2>picas</h2>
        <div>width: 10pc<br>
            height: 5pc</div>
    </div>
</body>
</html>
