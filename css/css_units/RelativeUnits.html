    <title>RelativeUnits</title>
    <link rel="stylesheet" href="RelativeUnits.css">
</head>
<body>
    <div id="parent">
        <b>Parent Container</b>
        <div id="child">
            <b>Child Container</b>
            <b>percentage % unit</b>
        </div>
    </div>

    <div id="container">
        <div id="block"></div>
    </div>

    <div id="font_container">
        parent elemnet font size is 10px
        <div id="root_element_font_block">font size from root element. 2rem -> 32px</div>
        <div id="parent_element_font_block">font size from it's parent element. 2em -> 20px</div>
    </div>
