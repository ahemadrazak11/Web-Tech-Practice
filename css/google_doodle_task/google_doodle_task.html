<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>google_doodle_task</title>
    <link rel="stylesheet" href="google_doodle_task.css">
</head>
<body>
    <center>
        <div id="google_doodle_container">
            <div class="google_doodle royalblue_color">
                <marquee behavior="alternate" direction="down" scrollamount="23">G</marquee>
            </div>
            <div class="google_doodle red_color">
                <marquee behavior="alternate" direction="down" scrollamount="20">o</marquee>
            </div>
            <div class="google_doodle orange_color">
                <marquee behavior="alternate" direction="down" scrollamount="17">o</marquee>
            </div>
            <div class="google_doodle royalblue_color">
                <marquee behavior="alternate" direction="down" scrollamount="14">g</marquee>
            </div>
            <div class="google_doodle green_color">
                <marquee behavior="alternate" direction="down" scrollamount="11">l</marquee>
            </div>
            <div class="google_doodle red_color">
                <marquee behavior="alternate" direction="down" scrollamount="8">e</marquee>
            </div>
        </div>
    </center>
</body>
</html>
