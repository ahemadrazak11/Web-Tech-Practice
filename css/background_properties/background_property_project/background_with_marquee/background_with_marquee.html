<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background_with_marquee</title>
    <link rel="stylesheet" href="background_with_marquee.css">
</head>
<body>

    <div id="container">
            <marquee behavior="" direction="right" scrollamount="13">
                <img src="/assets/images/moon.png" alt="" id="moon">
            </marquee>
    </div>

    <div>
        <marquee behavior="" direction="" scrollamount="16">
            <img src="/assets/images/satellite.png" alt="" id="rocket">
        </marquee>
    </div>
</body>
</html>
