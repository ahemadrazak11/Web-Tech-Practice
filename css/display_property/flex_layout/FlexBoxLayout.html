<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBoxLayout</title>
    <link rel="stylesheet" href="FlexBoxLayout.css" >
</head>
<body>
    <div id="course_headings_container">
        <h1 class="course_headings">CoreJava</h1>
        <h1 class="course_headings">WebDevelopment</h1>
        <h1 class="course_headings">SQL</h1>
        <h1 class="course_headings">AdvancedJava</h1>
        <h1 class="course_headings">Aptitude</h1>
    </div>
    <div id="circular_blocks_container">
        <div class="circular_blocks"></div>
        <div class="circular_blocks"></div>
    </div>
    <div id="upper_roman_number_blocks_container">
        <div class="upper_roman_number_blocks increase_flex_growing_factor" id="first_roman_number">I</div>
        <div class="upper_roman_number_blocks" id="second_roman_number">II</div>
        <div class="upper_roman_number_blocks increase_flex_growing_factor" id="third_roman_number">III</div>
        <div class="upper_roman_number_blocks" id="fourth_roman_number">IV</div>
        <div class="upper_roman_number_blocks increase_flex_growing_factor" id="fifth_roman_number">V</div>
    </div>
    <div id="rectangular_blocks_container">
        <div class="rectangular_blocks"></div>
        <div class="rectangular_blocks"></div>
        <div class="rectangular_blocks"></div>
        <div class="rectangular_blocks"></div>
        <div class="rectangular_blocks"></div>
    </div>
    <div id="square_blocks_container">
        <div class="square_blocks"></div>
        <div class="square_blocks"></div>
        <div class="square_blocks"></div>
        <div class="square_blocks"></div>
        <div class="square_blocks"></div>
    </div>
    <div id="number_content_blocks_container">
        <div class="number_content_blocks">One</div>
        <div class="number_content_blocks">Two</div>
        <div class="number_content_blocks">Three</div>
        <div class="number_content_blocks">Four</div>
        <div class="number_content_blocks">Five</div>
        <div class="number_content_blocks">Six</div>
        <div class="number_content_blocks">Seven</div>
        <div class="number_content_blocks">Eight</div>
        <div class="number_content_blocks">Nine</div>
        <div class="number_content_blocks">Ten</div>
        <div class="number_content_blocks">Eleven</div>
    </div>
</body>
</html>
