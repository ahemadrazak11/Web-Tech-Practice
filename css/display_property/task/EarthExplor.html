<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarthExplor</title>
    <link rel="stylesheet" href="EarthExplor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>
<body>
    
    <button id="btn_container">
        <span id="direction_container">
            <span id="n">N</span>
            <span id="e">E</span>
            <span id="s">S</span>
            <span id="w">W</span>
        </span>
        <span id="compass">
            <i class="fa-regular fa-compass"></i>
        </span>
        <span id="explor">Explore</span>
    </button>
    
</body>
</html>
