<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoxTransform</title>
    <link rel="stylesheet" href="BoxTransform.css">
</head>
<body>
    <div id="blocks_container">

        <div class="rows" id="first_row">
            <!-- rotate() function-->
            <div class="blocks" id="rotateX_block">
                <span>X-Axis</span>
                <br>
                <span>rotateX(360deg)</span>
            </div>
            <div class="blocks" id="rotateY_block">
                <span>Y-Axis</span>
                <br>
                <span>rotateY(360deg)</span>
            </div>
            <div class="blocks" id="rotateZ_block">
                <span>Z-Axis</span>
                <br>
                <span>rotateZ(360deg)</span>
            </div>
        </div>

        <div class="rows" id="second_row">
            <!-- skew() function-->
            <div class="blocks" id="skewX_block">
                <span>X-Axis</span>
                <br>
                <span>skewX(360deg)</span>
            </div>
            <div class="blocks" id="skewY_block">
                <span>Y-Axis</span>
                <br>
                <span>skewY(360deg)</span>
            </div>
            <div class="blocks" id="skewZ_block">
                <span>Z-Axis</span>
                <br>
                <span>skew(360deg)</span>
            </div>
        </div>

        <div class="rows" id="third_row">
            <!-- translate() function-->
            <div class="blocks" id="scaleX_block">
                <span>X-Axis</span>
                <br>
                <span>scaleX(2)</span>
            </div>
            <div class="blocks" id="scaleY_block">
                <span>Y-Axis</span>
                <br>
                <span>tscale(2)</span>
            </div>
            <div class="blocks" id="scaleZ_block">
                <span>Z-Axis</span>
                <br>
                <span>scale(2)</span>
            </div>
        </div>
    </div>
</body>
</html>
