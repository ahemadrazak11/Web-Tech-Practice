<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipPathProperty</title>
    <link rel="stylesheet" href="ClipPathProperty.css">
</head>
<body>
    <div id="main_container">
        <div id="container">
            <h2 class="headings">Polygon Shapes</h2>
            <div id="polygon_container">
                <div id="triangle" class="polygon_shapes"></div>
                <div id="top_arrow" class="polygon_shapes"></div>
                <div id="right_arrow" class="polygon_shapes"></div>
                <div id="bottom_arrow" class="polygon_shapes"></div>
                <div id="left_arrow" class="polygon_shapes"></div>
                <div id="pentagon" class="polygon_shapes"></div>
                <div id="hexagon" class="polygon_shapes"></div>
            </div>
            <h2 class="headings">Circular Shapes</h2>
            <div id="circular_container">
                <div id="circle" class="circular_shapes"></div>
                <div id="circle_top" class="circular_shapes"></div>
                <div id="circle_right" class="circular_shapes"></div>
                <div id="circle_bottom" class="circular_shapes"></div>
                <div id="circle_left" class="circular_shapes"></div>
                <div id="circle_top_left" class="circular_shapes"></div>
                <div id="circle_top_right" class="circular_shapes"></div>
                <div id="circle_bottom_right" class="circular_shapes"></div>
                <div id="circle_bottom_left" class="circular_shapes"></div>
            </div>
            <h2 class="headings">Elliptical Shapes</h2>
            <div id="ellips_container">
                <div id="ellips" class="elliptical_shapes"></div>
            </div>
        </div>
    </div>
</body>
</html>
