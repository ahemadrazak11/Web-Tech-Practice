<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>
    <link rel="stylesheet" href="EmployeeTable.css">
    <script src="EmployeeTable.js" defer></script>
</head>
<body>
    <table id="employee_table">
        <caption class="table_caption">Employee Details</caption>
        <tbody>
            <tr class="table_row">
                <td class="table_body_cell">Name</td>
                <td class="table_body_cell" id="name"></td>
            </tr>
            <tr class="table_row">
                <td class="table_body_cell">Age</td>
                <td class="table_body_cell" id="age"></td>
            </tr>
            <tr class="table_row">
                <td class="table_body_cell">Salary (in LPA)</td>
                <td class="table_body_cell" id="sal"></td>
            </tr>
            <tr class="table_row">
                <td class="table_body_cell">Designation</td>
                <td class="table_body_cell" id="des"></td>
            </tr>
            <tr class="table_row">
                <td class="table_body_cell">Job Location</td>
                <td class="table_body_cell" id="job_loc"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
